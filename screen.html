<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>금샘런웨이페스타 · 관객 투표 QR</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .stage { height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2.5vh 3vw 3vh; gap: 2.5vh; }
  .top { width: 100%; display: flex; justify-content: center; flex: none; }
  .top img { max-width: 100%; max-height: 40vh; border-radius: 1.6vh; box-shadow: var(--shadow); display: block; }
  .bottom { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; gap: 5vw; }
  .info { flex: 1; max-width: 46vw; }
  .state-label { display: inline-block; background: var(--pink); color: #fff; font-weight: 800; font-size: 2.6vh; padding: .5vh 1.6vh; border-radius: 999px; letter-spacing: .1em; }
  .state-label.wait { background: var(--text); }
  .state-team { font-family: "Black Han Sans", sans-serif; font-size: 9vh; line-height: 1.1; margin-top: 1.2vh; word-break: keep-all; color: var(--text); transform: rotate(-2deg); transform-origin: left; }
  .state-team.wait { font-size: 6vh; color: var(--muted); }
  .underline { height: 1vh; width: 70%; border-radius: 1vh; margin-top: 1vh; background: linear-gradient(90deg, var(--purple), var(--pink), transparent); transform: rotate(-2deg); transform-origin: left; }
  .guide { margin-top: 3vh; font-size: 3.2vh; font-weight: 700; color: var(--text); line-height: 1.45; }
  .guide em { font-style: normal; color: var(--pink); }
  .qrwrap { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center; }
  .qrbox { background: #fff; padding: 1.4vh; border-radius: 2.4vh; text-align: center; border: .6vh solid transparent;
           background-image: linear-gradient(#fff, #fff), linear-gradient(135deg, var(--purple), var(--pink), var(--gold));
           background-origin: border-box; background-clip: padding-box, border-box; box-shadow: 0 1.5vh 4vh rgba(106, 76, 245, .3); }
  .qrbox svg { height: min(44vh, 40vw); width: auto; display: block; }
  .qrbox .cap { font-family: "Black Han Sans", sans-serif; color: var(--text); font-size: 3.4vh; margin-top: .4vh; }
  .qrbox .cap b { color: var(--pink); font-weight: 400; }
  .qrs { display: flex; gap: 3vw; align-items: center; }
  .qritem { display: flex; flex-direction: column; align-items: center; }
  .qrbox.alt { background-image: linear-gradient(#fff, #fff), linear-gradient(135deg, var(--gold), var(--purple)); }
  body.two .qrbox svg { height: min(36vh, 24vw); }
  body.two .info { max-width: 34vw; }
  .url { color: var(--muted); font-size: 2vh; margin-top: 1vh; font-weight: 600; }
  .fs { position: fixed; right: 12px; bottom: 12px; opacity: .25; }
  .fs:hover { opacity: 1; }
  .spark { position: fixed; color: var(--purple); pointer-events: none; animation: tw 2.4s infinite ease-in-out; }
  @keyframes tw { 50% { opacity: .25; transform: scale(.7); } }
  @media (orientation: portrait) {
    .bottom { flex-direction: column; gap: 3vh; text-align: center; }
    .info { max-width: 90vw; } .state-team, .underline { transform-origin: center; } .underline { margin: 1vh auto 0; }
    .qrbox svg { height: auto; width: 60vw; }
  }
</style>
</head>
<body>
<span class="spark" style="left:3vw;bottom:8vh;font-size:5vh">✦</span>
<span class="spark" style="right:4vw;bottom:30vh;font-size:3.5vh;color:var(--pink);animation-delay:.8s">✦</span>
<span class="spark" style="left:45vw;bottom:4vh;font-size:3vh;animation-delay:1.5s">✦</span>
<div class="stage">
  <div class="top"><img src="banner.jpg" alt="금정구청소년 어울림마당 금샘런웨이페스타 · 2026.11.21(토) 14:00 · 온천천 어울마당"></div>
  <div class="bottom">
    <div class="info">
      <div class="state-label wait" id="label">관객 투표</div>
      <div class="state-team wait" id="team">무대 준비 중</div>
      <div class="underline"></div>
      <div class="guide">휴대폰 카메라로 QR을 찍고<br><em>마음에 드는 무대</em>에 점수를 주세요!</div>
    </div>
    <div class="qrwrap">
      <div class="qrs">
        <div class="qritem"><div class="qrbox"><div id="qr"></div><div class="cap" id="qrcap">📱 <b>관객</b> 투표하기</div></div>
          <div class="url" id="url"></div></div>
        <div class="qritem" id="q2" hidden><div class="qrbox alt"><div id="qr2"></div><div class="cap">🌟 <b>참가자</b> 설문</div></div>
          <div class="url" id="url2"></div></div>
      </div>
    </div>
  </div>
</div>
<button class="btn sm fs" onclick="document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()">전체화면</button>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="qrcode.js"></script>
<script>
(function () {
  const voteUrl = location.origin + "/vote";
  const qr = qrcode(0, "M");
  qr.addData(voteUrl); qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 10, margin: 30, scalable: true });
  document.getElementById("url").textContent = voteUrl.replace(/^https?:\/\//, "");
  const surveyUrl = location.origin + "/survey";
  const qr2 = qrcode(0, "M"); qr2.addData(surveyUrl); qr2.make();
  document.getElementById("qr2").innerHTML = qr2.createSvgTag({ cellSize: 10, margin: 30, scalable: true });
  document.getElementById("url2").textContent = surveyUrl.replace(/^https?:\/\//, "");
  const guide = document.querySelector(".guide"), guideVote = guide.innerHTML, q2 = document.getElementById("q2"), qrcap = document.getElementById("qrcap");
  if (configMissing()) return;
  const label = document.getElementById("label"), team = document.getElementById("team");
  poll(async () => {
    const st = await getState();
    const open = st.teams.filter((t) => t.status === "open");
    const survey = st.survey && !open.length;
    document.body.classList.toggle("two", survey); q2.hidden = !survey;
    qrcap.innerHTML = survey ? "📱 <b>관객</b> 설문" : st.rsurvey ? "📱 <b>관객</b> 투표·설문" : "📱 <b>관객</b> 투표하기";
    guide.innerHTML = survey ? "오늘 행사 어떠셨나요?<br><em>사후 만족도 조사</em>에 참여해 주세요!" : guideVote;
    if (survey) {
      label.textContent = "사후 만족도 조사"; label.classList.remove("wait");
      team.textContent = "1분 설문 참여해 주세요!"; team.classList.remove("wait");
      return;
    }
    if (open.length) {
      label.textContent = "지금 투표 중"; label.classList.remove("wait");
      team.textContent = open.map((t) => t.name).join(", "); team.classList.remove("wait");
    } else {
      label.textContent = "관객 투표"; label.classList.add("wait");
      team.textContent = "다음 무대를 준비 중입니다"; team.classList.add("wait");
    }
  }, 4000);
})();
</script>
</body>
</html>
